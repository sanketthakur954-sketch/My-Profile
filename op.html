<!DOCTYPE html>
<html>
<head>
<title>COPA PPT Guide</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.container{
    display:flex;
    height:100vh;
}

.left{
    width:50%;
    padding:40px;
    overflow-y:auto;
}

.right{
    width:50%;
    background:#020617;
    display:flex;
    align-items:center;
    justify-content:center;
}

img{
    width:80%;
    border-radius:15px;
}

h1{
    color:#22c55e;
}

button{
    padding:10px 20px;
    margin-top:20px;
    background:#22c55e;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    
    <div class="left">
        <h1 id="title">Slide 1: Title Slide</h1>
        <p id="content"></p>
        <button onclick="next()">Next Step</button>
    </div>

    <div class="right">
        <img id="image" src="">
    </div>

</div>

<script>
let step = 0;

const data = [
{
title:"Slide 1: Title Slide",
content:`PPT me likho:
"What is COPA Trade"

Design:
- Background dark blue rakho
- Title center me rakho
- Niche apna naam likho

Animation:
- Title → Zoom
- Name → Fade

Kaise kare:
PowerPoint → Animations → Zoom select karo`,
img:"https://images.unsplash.com/photo-1581091215367-59ab6b6c64d9"
},

{
title:"Slide 2: Introduction",
content:`Likho:
COPA ka full form Computer Operator and Programming Assistant hai.
Ye ITI ka ek trade hai.

Design:
- Left text, right image
- 3 lines se jyada mat likho

Animation:
- Har line ko alag Fade karo`,
img:"https://images.unsplash.com/photo-1518770660439-4636190af475"
},

{
title:"Slide 3: Skills",
content:`Likho:
- Programming
- Typing
- MS Office
- Internet

Design:
- Bullet points use karo

Animation:
- Appear → one by one`,
img:"https://images.unsplash.com/photo-1555066931-4365d14bab8c"
},

{
title:"Slide 4: Jobs",
content:`Likho:
- Data Entry Operator
- Computer Operator
- Office Assistant

Design:
- Icons use karo (computer icon)

Animation:
- Fade + Zoom`,
img:"https://images.unsplash.com/photo-1521737604893-d14cc237f11d"
},

{
title:"Slide 5: Conclusion",
content:`Likho:
COPA ek best course hai jo computer skills deta hai aur job help karta hai.

Animation:
- Slow fade

Last slide:
Thank You`,
img:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
}
];

function show(){
document.getElementById("title").innerText = data[step].title;
document.getElementById("content").innerText = data[step].content;
document.getElementById("image").src = data[step].img;
}

function next(){
if(step < data.length-1){
step++;
show();
}
}

show();
</script>

</body>
</html>
